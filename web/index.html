<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Image Generator</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg"></div>
    <main class="container">
      <header class="header">
        <div>
          <h1>AI Image Generator</h1>
          <p class="subtitle">
            Type a prompt, pick a size, optionally add a style. Your API key stays on the server.
          </p>
        </div>
        <a class="pill" href="https://platform.openai.com/" target="_blank" rel="noreferrer">API keys</a>
      </header>

      <section class="card">
        <form id="genForm" class="form">
          <label class="field">
            <span>Prompt</span>
            <textarea
              id="prompt"
              name="prompt"
              rows="4"
              placeholder="A cinematic photo of a futuristic city at sunset, ultra-detailed, 35mm"
              required
            ></textarea>
          </label>

          <div class="row">
            <label class="field">
              <span>Style (optional)</span>
              <input
                id="style"
                name="style"
                placeholder="e.g. watercolor, anime, minimal, cyberpunk"
                autocomplete="off"
              />
            </label>

            <label class="field">
              <span>Size</span>
              <select id="size" name="size">
                <option value="512x512">512×512</option>
                <option value="1024x1024" selected>1024×1024</option>
                <option value="1024x1536">1024×1536 (portrait)</option>
                <option value="1536x1024">1536×1024 (landscape)</option>
              </select>
            </label>
          </div>

          <div class="actions">
            <button id="generateBtn" class="btn primary" type="submit">
              <span class="spinner" aria-hidden="true"></span>
              Generate
            </button>
            <button class="btn" type="button" id="randomBtn">Surprise me</button>
            <button class="btn danger" type="button" id="clearBtn">Clear</button>
          </div>

          <div id="status" class="status" role="status" aria-live="polite"></div>
        </form>
      </section>

      <section class="grid">
        <div class="gridHeader">
          <h2>Results</h2>
          <div class="hint">Tip: click an image to open full size.</div>
        </div>
        <div id="results" class="results"></div>
      </section>

      <footer class="footer">
        <span>Local app · HTML/CSS/JS + Node/Express</span>
        <span class="dot">•</span>
        <a href="/api/health" target="_blank" rel="noreferrer">health</a>
      </footer>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
